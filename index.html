<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>冬天的第一份礼物❄️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --text: #1a1a1a;
      --border: #e5e5e5;
      --accent: #0078d4;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100vh;
      overflow: hidden;
      position: relative;
    }
    body {
      background: linear-gradient(135deg, #e6f7ff, #f0e6ff);
      color: var(--text);
      font-family: "Noto Sans SC", sans-serif;
    }
    .start-modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 85vw;
      max-width: 450px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      z-index: 999;
    }
    .start-modal h3 { margin-bottom: 20px; font-size: 22px; color: var(--text); }
    .start-modal p { margin-bottom: 25px; font-size: 16px; color: #4a5568; line-height: 1.6; }
    .start-btn {
      padding: 12px 40px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }
    .start-btn:hover { background: #0066b2; }
    .snow {
      position: fixed;
      color: #ffffff;
      font-size: 12px;
      pointer-events: none;
      z-index: 1;
      opacity: 0.8;
    }
    .popup {
      position: fixed;
      width: 200px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 7px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      overflow: hidden;
      z-index: 2;
      opacity: 0;
      transform: scale(0.95);
      transition: opacity 0.6s ease-out, transform 0.6s ease-out, left 0.6s ease, top 0.6s ease;
    }
    .popup.fade-in {
      opacity: 1;
      transform: scale(1);
    }
    .popup.fade-out {
      opacity: 0;
      transform: scale(0.9);
    }
    .popup.final {
      width: 320px;
      top: 50% !important;
      left: 50% !important;
      transform: translate(-50%, -50%) !important;
      z-index: 999;
      animation: pulse 2s infinite 0.5s;
      transition: none;
    }
    .popup .header {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      background: #f3f3f3;
      border-bottom: 1px solid var(--border);
    }
    .popup.final .header {
      background: var(--accent);
      border-bottom-color: #0066b2;
      padding: 8px 12px;
    }
    .popup .header .icon { font-size: 12px; }
    .popup.final .header .icon { color: white; font-size: 16px; }
    .popup .header .title { font-weight: 800; font-size: 11px; margin: 0; }
    .popup.final .header .title { color: white; font-size: 14px; }
    .popup .content { padding: 8px 10px; font-size: 15px; font-weight: 500; text-align: center; }
    .popup.final .content {
      font-size: 18px;
      padding: 15px 10px;
      line-height: 1.6;
    }
    .popup.theme-blue .header { background: #e3f2fd; border-bottom-color: #bbdefb; }
    .popup.theme-blue .content { background: #f1f8ff; }
    .popup.theme-green .header { background: #e8f5e9; border-bottom-color: #c8e6c9; }
    .popup.theme-green .content { background: #f1f8f4; }
    .popup.theme-orange .header { background: #fff3e0; border-bottom-color: #ffe0b2; }
    .popup.theme-orange .content { background: #fffaf3; }
    .popup.theme-purple .header { background: #f3e5f5; border-bottom-color: #e1bee7; }
    .popup.theme-purple .content { background: #faf5fc; }
    .popup.theme-pink .header { background: #fce4ec; border-bottom-color: #f8bbd0; }
    .popup.theme-pink .content { background: #fff0f5; }
    @keyframes pulse {
      0% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.03); }
      100% { transform: translate(-50%, -50%) scale(1); }
    }
    @media (max-width: 640px) {
      .popup { width: 180px; }
      .popup.final { width: 85vw; }
      .popup.final .content { font-size: 16px; }
    }
  </style>
</head>
<body>
  <div class="start-modal" id="startModal">
    <h3>神秘礼物❄️</h3>
    <p>冬天的第一份温暖，<br>确定要打开这份专属惊喜吗？</p>
    <button class="start-btn" id="startBtn">打开礼物</button>
  </div>
  <div id="snowContainer"></div>
  <div id="popupContainer"></div>
  <!-- 已替换为你的在线音频链接 -->
  <audio id="bgMusic" preload="auto" loop>
    <source src="https://image2url.com/r2/bucket2/audio/1767920913270-e27f984e-ed37-4de9-af6f-f143107a58f4.mp3" type="audio/mpeg">
  </audio>
  <script>
    const el = {
      startModal: document.getElementById('startModal'),
      startBtn: document.getElementById('startBtn'),
      snowContainer: document.getElementById('snowContainer'),
      popupContainer: document.getElementById('popupContainer'),
      bgMusic: document.getElementById('bgMusic')
    };
    const config = {
      batchSize: 3,
      batchInterval: 300,
      popupShowDuration: 4000,
      popupRemoveDelay: 800,
      tips: [
        "冬天要多喝热水呀", "记得添件厚衣服~", "今天也要开心呀",
        "寒风里也要保持微笑", "愿你被生活温柔包裹", "这个冬天有我陪你",
        "把烦恼都冻在冬天里", "冬日限定的温暖送给你", "照顾好自己呀",
        "愿你的冬天满是阳光", "平安喜乐，温暖过冬", "慢慢相遇，好好生活"
      ],
      finalTips: [
        "这个冬天，愿你有衣暖身，有人暖心，一切顺遂——元野",
        "寒来暑往，秋收冬藏，愿你所求皆如愿，所行皆坦途——元野",
        "雪花飘落，美好将至，愿你被世界温柔以待，万事胜意——元野"
      ],
      themes: ['theme-blue', 'theme-green', 'theme-orange', 'theme-purple', 'theme-pink']
    };
    function initSnow() {
      for (let i = 0; i < 4; i++) createSnow();
      setInterval(() => createSnow(), 600);
    }
    function createSnow() {
      const snow = document.createElement('div');
      snow.className = 'snow';
      snow.textContent = '❄️';
      const left = Math.random() * 100;
      const size = Math.random() * 6 + 6;
      const duration = Math.random() * 8 + 6;
      
      snow.style.cssText = `
        left: ${left}vw;
        top: -20px;
        font-size: ${size}px;
        transition: top ${duration}s linear;
      `;
      
      el.snowContainer.appendChild(snow);
      setTimeout(() => snow.style.top = '100vh', 100);
      setTimeout(() => snow.remove(), duration * 1000);
    }
    let popupTimerQueue = [];
    function startContinuousPopups() {
      clearAllPopupTimers();
      function createPopupBatch() {
        for (let i = 0; i < config.batchSize; i++) {
          const randomDelay = Math.random() * 150;
          const timer = setTimeout(() => {
            const theme = config.themes[Math.floor(Math.random() * config.themes.length)];
            const tip = config.tips[Math.floor(Math.random() * config.tips.length)];
            const popup = createPopupElement(theme, tip);
            
            popup.style.left = `${Math.random() * (window.innerWidth - 210) + 5}px`;
            popup.style.top = `${Math.random() * (window.innerHeight - 70) + 5}px`;
            
            el.popupContainer.appendChild(popup);
            setTimeout(() => popup.classList.add('fade-in'), 10);
            const fadeTimer = setTimeout(() => {
              popup.classList.remove('fade-in');
              popup.classList.add('fade-out');
              const removeTimer = setTimeout(() => {
                if (popup.parentNode) popup.remove();
              }, config.popupRemoveDelay);
              popupTimerQueue.push(removeTimer);
            }, config.popupShowDuration);
            popupTimerQueue.push(fadeTimer);
          }, randomDelay);
          popupTimerQueue.push(timer);
        }
        const nextBatchTimer = setTimeout(createPopupBatch, config.batchInterval);
        popupTimerQueue.push(nextBatchTimer);
      }
      createPopupBatch();
    }
    function clearAllPopupTimers() {
      popupTimerQueue.forEach(timerId => clearTimeout(timerId));
      popupTimerQueue = [];
    }
    function createPopupElement(theme, content) {
      const popup = document.createElement('div');
      popup.className = `popup ${theme}`;
      popup.innerHTML = `
        <div class="header">
          <span class="icon">💝</span>
          <h4 class="title">温馨提示</h4>
        </div>
        <div class="content">${content}</div>
      `;
      return popup;
    }
    function convergeVisiblePopups() {
      const centerX = window.innerWidth / 2 - 100;
      const centerY = window.innerHeight / 2 - 30;
      const visiblePopups = Array.from(document.querySelectorAll('.popup:not(.final)')).filter(popup => {
        return popup.parentNode !== null;
      });
      visiblePopups.forEach((popup, index) => {
        popup.classList.remove('fade-out');
        popup.classList.add('fade-in');
        popup.style.opacity = '0.8';
        
        const randomInterval = Math.random() * 10 + 5;
        setTimeout(() => {
          popup.style.left = `${centerX}px`;
          popup.style.top = `${centerY}px`;
        }, index * randomInterval);
      });
      setTimeout(() => {
        visiblePopups.forEach(popup => {
          popup.classList.remove('fade-in');
          popup.classList.add('fade-out');
          setTimeout(() => {
            if (popup.parentNode) popup.remove();
          }, config.popupRemoveDelay);
        });
        showFinalPopup();
      }, 1200);
    }
    function showFinalPopup() {
      const tip = config.finalTips[Math.floor(Math.random() * config.finalTips.length)];
      const popup = document.createElement('div');
      popup.className = 'popup final theme-blue';
      popup.innerHTML = `
        <div class="header">
          <span class="icon">❄️</span>
          <h4 class="title">专属祝福</h4>
        </div>
        <div class="content">${tip}</div>
      `;
      el.popupContainer.appendChild(popup);
      setTimeout(() => popup.classList.add('fade-in'), 10);
    }
    function initEvents() {
      el.startBtn.addEventListener('click', () => {
        el.startModal.style.opacity = '0';
        setTimeout(() => el.startModal.remove(), 500);
        
        el.bgMusic.loop = false;
        el.bgMusic.play().catch(err => {
          document.body.addEventListener('click', () => el.bgMusic.play(), { once: true });
        });
        
        startContinuousPopups();
        el.bgMusic.addEventListener('ended', () => {
          clearAllPopupTimers();
          setTimeout(convergeVisiblePopups, 300);
        }, { once: true });
      });
    }
    window.onload = function() {
      initSnow();
      initEvents();
    };
  </script>
</body>
</html>
